<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Melodownload · Spotify Track Extractor</title>
    <!-- Google Fonts & simple CSS reset -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: radial-gradient(circle at 10% 30%, #0a0f1c, #03050b);
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2rem 1rem;
        }

        /* main glass-card container */
        .downloader-container {
            max-width: 760px;
            width: 100%;
            background: rgba(18, 22, 33, 0.75);
            backdrop-filter: blur(12px);
            border-radius: 2.5rem;
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 25px 45px -12px rgba(0, 0, 0, 0.5), 0 0 0 0.5px rgba(255, 255, 255, 0.02) inset;
            transition: all 0.2s ease;
            padding: 2rem 1.8rem;
        }

        /* header section with spotify vibe */
        .brand {
            text-align: center;
            margin-bottom: 2.2rem;
        }
        .brand h1 {
            font-size: 2.2rem;
            font-weight: 700;
            background: linear-gradient(135deg, #FFFFFF 30%, #1DB954 80%);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            letter-spacing: -0.3px;
            display: inline-flex;
            align-items: center;
            gap: 10px;
        }
        .brand h1::before {
            content: "♫";
            background: none;
            background-clip: unset;
            -webkit-background-clip: unset;
            color: #1DB954;
            font-size: 2rem;
            font-weight: 400;
        }
        .sub {
            color: #a1a9c2;
            font-size: 0.85rem;
            margin-top: 8px;
            font-weight: 400;
            border-top: 1px dashed rgba(29, 185, 84, 0.3);
            display: inline-block;
            padding-top: 8px;
        }

        /* input area - FULLY RESPONSIVE BUTTON & LAYOUT */
        .input-group {
            background: rgba(12, 15, 25, 0.7);
            border-radius: 3rem;
            padding: 0.2rem;
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 1.8rem;
            border: 1px solid rgba(29, 185, 84, 0.2);
            transition: all 0.2s;
        }
        .input-group:focus-within {
            border-color: #1DB954;
            box-shadow: 0 0 12px rgba(29, 185, 84, 0.2);
        }
        .input-group input {
            flex: 1;
            background: transparent;
            border: none;
            padding: 1rem 1.5rem;
            font-size: 1rem;
            color: #f0f3fa;
            font-weight: 500;
            outline: none;
            font-family: 'Inter', monospace;
            letter-spacing: -0.2px;
            min-width: 0;
        }
        .input-group input::placeholder {
            color: #6a6f87;
            font-weight: 400;
            font-size: 0.9rem;
        }
        
        /* ========= RESPONSIVE BUTTON LOGIC ========= */
        .input-group button {
            background: linear-gradient(105deg, #1DB954 0%, #17a74a 100%);
            border: none;
            padding: 0 2rem;
            border-radius: 3rem;
            font-weight: 600;
            font-size: 0.95rem;
            color: white;
            cursor: pointer;
            transition: transform 0.15s, box-shadow 0.2s, padding 0.2s ease;
            display: flex;
            align-items: center;
            gap: 8px;
            font-family: 'Inter', sans-serif;
            letter-spacing: -0.2px;
            box-shadow: 0 6px 14px rgba(29, 185, 84, 0.25);
            white-space: nowrap;
        }
        
        @media (min-width: 641px) {
            .input-group button {
                padding: 0 2rem;
                font-size: 0.95rem;
                min-width: 130px;
            }
        }
        
        @media (max-width: 640px) and (min-width: 481px) {
            .input-group button {
                padding: 0 1.4rem;
                font-size: 0.85rem;
                gap: 6px;
            }
            .input-group button span:first-child {
                font-size: 0.9rem;
            }
        }
        
        @media (max-width: 480px) {
            .input-group {
                gap: 10px;
                padding: 0.25rem;
            }
            .input-group button {
                padding: 0 1.1rem;
                font-size: 0.8rem;
                gap: 5px;
                min-height: 48px;
                border-radius: 2.5rem;
            }
            .input-group button span:first-child {
                font-size: 0.85rem;
            }
            .input-group input {
                padding: 0.85rem 1.2rem;
                font-size: 0.9rem;
            }
        }
        
        @media (max-width: 380px) {
            .input-group button {
                padding: 0 0.9rem;
                font-size: 0.75rem;
                gap: 4px;
            }
            .input-group button span:first-child {
                font-size: 0.8rem;
            }
        }
        
        .input-group button:hover {
            transform: scale(1.02);
            background: linear-gradient(105deg, #26c95f, #1aa64b);
            box-shadow: 0 10px 20px rgba(29, 185, 84, 0.4);
        }
        .input-group button:active {
            transform: scale(0.98);
        }
        
        .input-group button .spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255,255,255,0.3);
            border-top: 2px solid white;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
            margin-right: 4px;
        }
        
        /* result card area */
        .result-card {
            margin-top: 2rem;
            background: rgba(0, 0, 0, 0.45);
            border-radius: 2rem;
            padding: 1.8rem;
            transition: all 0.3s ease;
            border: 1px solid rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(4px);
        }

        .song-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 1.8rem;
            align-items: flex-start;
        }
        .cover-area {
            flex-shrink: 0;
            border-radius: 1.2rem;
            overflow: hidden;
            box-shadow: 0 18px 30px -10px rgba(0, 0, 0, 0.5);
            background: #0b0e17;
        }
        .cover-area img {
            width: 160px;
            height: 160px;
            object-fit: cover;
            display: block;
        }
        .song-details {
            flex: 1;
            text-align: left;
        }
        .song-title {
            font-size: 1.7rem;
            font-weight: 700;
            color: white;
            letter-spacing: -0.3px;
            margin-bottom: 8px;
            line-height: 1.2;
            word-break: break-word;
        }
        .artist-name {
            font-size: 1rem;
            font-weight: 500;
            color: #c0c7e0;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
        }
        .artist-name::before {
            content: "🎤";
            font-size: 0.9rem;
            opacity: 0.8;
        }
        .track-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin: 12px 0 8px 0;
            align-items: center;
        }
        .duration-badge {
            background: rgba(29, 185, 84, 0.15);
            backdrop-filter: blur(4px);
            padding: 4px 12px;
            border-radius: 40px;
            font-size: 0.8rem;
            font-weight: 500;
            color: #b3f0c4;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .quality-badge {
            background: rgba(255, 193, 7, 0.15);
            backdrop-filter: blur(4px);
            padding: 4px 12px;
            border-radius: 40px;
            font-size: 0.8rem;
            font-weight: 500;
            color: #ffd966;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .album-name {
            font-size: 0.85rem;
            color: #8c93ae;
            background: rgba(29, 185, 84, 0.12);
            display: inline-block;
            padding: 4px 12px;
            border-radius: 40px;
            margin-top: 8px;
        }
        .download-btn-wrapper {
            margin-top: 24px;
            text-align: left;
        }
        .download-btn {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            background: #1DB954;
            color: white;
            border: none;
            padding: 12px 28px;
            border-radius: 40px;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.2s;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
            font-family: 'Inter', sans-serif;
        }
        .download-btn:hover {
            background: #1ed760;
            transform: translateY(-2px);
            box-shadow: 0 12px 22px rgba(29, 185, 84, 0.4);
        }
        .error-message {
            background: rgba(255, 70, 70, 0.15);
            border-left: 4px solid #ff5c5c;
            padding: 1rem;
            border-radius: 1rem;
            color: #ffb4b4;
            font-weight: 500;
        }
        .loading-spinner {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            gap: 12px;
        }
        .spinner {
            width: 42px;
            height: 42px;
            border: 3px solid rgba(29, 185, 84, 0.2);
            border-top: 3px solid #1DB954;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg);}
            100% { transform: rotate(360deg);}
        }
        .info-note {
            font-size: 0.75rem;
            text-align: center;
            margin-top: 1.8rem;
            color: #5f6680;
            border-top: 1px solid rgba(255,255,255,0.05);
            padding-top: 1.2rem;
        }
        .placeholder-text {
            text-align: center;
            color: #8f95ae;
            padding: 1.8rem;
            font-size: 0.9rem;
            background: rgba(255,255,255,0.02);
            border-radius: 1.8rem;
        }
        button:disabled {
            opacity: 0.6;
            transform: none;
            cursor: not-allowed;
        }
        
        @media (max-width: 580px) {
            .downloader-container {
                padding: 1.5rem;
            }
            .song-grid {
                flex-direction: column;
                align-items: center;
                text-align: center;
            }
            .song-details {
                text-align: center;
            }
            .download-btn-wrapper {
                text-align: center;
            }
            .cover-area img {
                width: 140px;
                height: 140px;
            }
            .song-title {
                font-size: 1.4rem;
            }
            .artist-name {
                justify-content: center;
            }
            .track-meta {
                justify-content: center;
            }
        }
        
        @media (max-width: 400px) {
            .input-group button {
                padding: 0 0.8rem;
                font-size: 0.7rem;
            }
            .brand h1 {
                font-size: 1.8rem;
            }
        }
    </style>
</head>
<body>

<div class="downloader-container">
    <div class="brand">
        <h1>Melodownload</h1>
        <div class="sub">extract &nbsp;⚡ &nbsp; high-quality track info</div>
    </div>

    <div class="input-group">
        <input 
            type="text" 
            id="songUrl" 
            placeholder="https://open.spotify.com/track/... or Spotify track ID / URL"
            autocomplete="off"
        >
        <button id="fetchBtn" onclick="downloadSong()">
            <span>⟳</span> Get Song
        </button>
    </div>

    <div id="result"></div>
    <div class="info-note">
        ⚡ Paste any Spotify track link • instant preview & download link
    </div>
</div>

<script>
    // ==================== UPDATED FOR NEW API ENDPOINT STRUCTURE ====================
    // API Response Format (based on provided data):
    // {
    //   success: true,
    //   message: "success", 
    //   data: {
    //     title: "...", 
    //     author: "...", 
    //     thumbnail: "...", 
    //     duration: "4:08",
    //     medias: [{ url: "...", quality: "HQ", extension: "mp3" }],
    //     audioPreview: "...",
    //     ...
    //   }
    // }
    
    const fetchButton = document.getElementById('fetchBtn');
    const urlInput = document.getElementById('songUrl');

    function setLoading(isLoading) {
        if (isLoading) {
            fetchButton.disabled = true;
            fetchButton.innerHTML = '<span class="spinner" style="width:14px;height:14px;border-width:2px; margin-right:4px;"></span><span style="margin-left:2px;">Getting...</span>';
        } else {
            fetchButton.disabled = false;
            fetchButton.innerHTML = '<span>⟳</span> Get Song';
        }
    }

    function displayError(message, details = '') {
        const resultDiv = document.getElementById('result');
        resultDiv.innerHTML = `
            <div class="result-card">
                <div class="error-message">
                    <strong>⚠️ Oops! ${escapeHtml(message)}</strong>
                    ${details ? `<div style="font-size:0.8rem; margin-top:8px; opacity:0.8;">${escapeHtml(details)}</div>` : ''}
                    <div style="margin-top:14px; font-size:0.85rem;">✨ Check your Spotify link and try again.</div>
                </div>
            </div>
        `;
    }

    function showLoadingUI() {
        const resultDiv = document.getElementById('result');
        resultDiv.innerHTML = `
            <div class="result-card">
                <div class="loading-spinner">
                    <div class="spinner"></div>
                    <div style="color:#b9c3e6;">Fetching track data from Spotify...</div>
                    <div style="font-size:0.75rem; color:#6c7595;">please wait a moment</div>
                </div>
            </div>
        `;
    }

    // Helper: extract download URL from medias array (best quality)
    function getDownloadUrlFromMedias(medias) {
        if (!medias || !Array.isArray(medias) || medias.length === 0) return null;
        // Look for audio type with mp3 extension, prioritize HQ
        const audioMedia = medias.find(m => m.type === 'audio' || m.extension === 'mp3');
        if (audioMedia && audioMedia.url) return audioMedia.url;
        // fallback: first media with url
        const firstValid = medias.find(m => m.url);
        return firstValid ? firstValid.url : null;
    }

    // Helper: get quality info from medias
    function getQualityFromMedias(medias) {
        if (!medias || !Array.isArray(medias) || medias.length === 0) return null;
        const audioMedia = medias.find(m => m.type === 'audio' || m.extension === 'mp3');
        return audioMedia?.quality || medias[0]?.quality || null;
    }

    // Format duration helper (handles "4:08" format or seconds)
    function formatDurationDisplay(duration) {
        if (!duration) return null;
        // if already in MM:SS format
        if (typeof duration === 'string' && duration.includes(':')) return duration;
        // if numeric seconds
        const seconds = parseInt(duration);
        if (!isNaN(seconds) && seconds > 0) {
            const mins = Math.floor(seconds / 60);
            const secs = seconds % 60;
            return `${mins}:${secs.toString().padStart(2, '0')}`;
        }
        return duration;
    }

    // Main download function - UPDATED for new endpoint structure
    window.downloadSong = async function() {
        let rawUrl = urlInput.value.trim();
        if (!rawUrl) {
            displayError("URL missing", "Please enter a valid Spotify track URL or ID.");
            return;
        }

        showLoadingUI();
        setLoading(true);

        try {
            // Use your new endpoint configuration
            // IMPORTANT: Replace with your actual API endpoint if different
            // Based on your description, same RapidAPI host but response structure changed
            const rapidAPIKey = "a9d8dd292fmsh4e0d325b6531420p1592f7jsn0fbe4be42194";
            const rapidAPIHost = "spotify-music-mp3-downloader-api.p.rapidapi.com";
            
            const url =  `https://spotify-music-mp3-downloader-api.p.rapidapi.com/download?link=${encodeURIComponent(rawUrl)}`;
            const controller = new AbortController();
            const timeoutId = setTimeout(() => controller.abort(), 30000);
            
            const response = await fetch(url, {
                method: "GET",
                headers: {
                    "x-rapidapi-key": rapidAPIKey,
                    "x-rapidapi-host": rapidAPIHost
                },
                signal: controller.signal
            });
            clearTimeout(timeoutId);
            
            console.log("API Status:", response.status);
            
            let resultData;
            const textResponse = await response.text();
            try {
                resultData = JSON.parse(textResponse);
            } catch(e) {
                console.error("JSON parse error", textResponse.slice(0,200));
                throw new Error("Invalid response from server.");
            }
            
            if (!response.ok) {
                let errorMsg = `Server error ${response.status}`;
                if (resultData && resultData.message) errorMsg = resultData.message;
                throw new Error(errorMsg);
            }
            
            // NEW: Check for success flag and data object (based on your new endpoint)
            if (resultData && resultData.success === true && resultData.data) {
                renderSongCardNew(resultData.data);
            } 
            else if (resultData && resultData.data && (resultData.data.title || resultData.data.medias)) {
                renderSongCardNew(resultData.data);
            }
            else {
                let errDetail = resultData?.message || resultData?.error || "No track information returned.";
                throw new Error(errDetail);
            }
            
        } catch (error) {
            console.error("Download error:", error);
            let friendlyMsg = "Failed to fetch song details.";
            if (error.name === 'AbortError') friendlyMsg = "Request timeout. The server took too long to respond.";
            else if (error.message.includes("Failed to fetch")) friendlyMsg = "Network error. Please check your connection.";
            else friendlyMsg = error.message || "Unexpected API error.";
            displayError(friendlyMsg, "Make sure the Spotify link is public and valid.");
        } finally {
            setLoading(false);
        }
    };
    
    // NEW render function for the updated API structure (title, author, thumbnail, medias, duration, etc.)
    function renderSongCardNew(songData) {
        if (!songData) {
            displayError("Incomplete track data", "The API response missed essential song information.");
            return;
        }
        
        // Map fields according to your new endpoint structure:
        // data.title, data.author, data.thumbnail, data.duration, data.medias[].url, data.audioPreview
        const title = songData.title || songData.name || "Unknown Title";
        // author field contains artist(s)
        const artist = songData.author || songData.artist || songData.artists || "Anonymous Artist";
        // thumbnail is the cover image
        const cover = songData.thumbnail || songData.cover || songData.image || "https://placehold.co/400x400/1a1e2a/1DB954?text=🎵";
        // duration from API (format like "4:08")
        const durationRaw = songData.duration || songData.duration_sec || null;
        const durationFormatted = formatDurationDisplay(durationRaw);
        
        // Get download link from medias array (primary)
        let downloadLink = null;
        let quality = null;
        
        if (songData.medias && Array.isArray(songData.medias) && songData.medias.length > 0) {
            downloadLink = getDownloadUrlFromMedias(songData.medias);
            quality = getQualityFromMedias(songData.medias);
        }
        
        // Fallback: audioPreview or direct downloadLink field
        if (!downloadLink && songData.audioPreview) {
            downloadLink = songData.audioPreview;
            quality = "Preview";
        }
        if (!downloadLink && songData.downloadLink) downloadLink = songData.downloadLink;
        if (!downloadLink && songData.url) downloadLink = songData.url;
        
        // Additional metadata: track_id, source, year might be present
        const trackId = songData.track_id || songData.id || null;
        const source = songData.source || "Spotify";
        
        const resultDiv = document.getElementById('result');
        
        let downloadSection = '';
        if (downloadLink && downloadLink !== '') {
            downloadSection = `
                <div class="download-btn-wrapper">
                    <a href="${escapeHtmlAttr(downloadLink)}" target="_blank" rel="noopener noreferrer" class="download-btn">
                        ⬇️ Download Track ${quality ? `(${quality})` : '(MP3)'}
                    </a>
                    <p style="font-size:0.7rem; margin-top:10px; color:#7f88aa;">Direct high-quality link • right-click save as</p>
                </div>
            `;
        } else {
            downloadSection = `
                <div class="download-btn-wrapper">
                    <div style="background:#2a2f3f; border-radius:40px; padding:12px 20px; display:inline-block;">
                        ⚠️ No download link available
                    </div>
                    <p style="font-size:0.75rem; margin-top:8px;">Try another track or refresh later</p>
                </div>
            `;
        }
        
        // Meta badges HTML
        const metaBadges = `
            <div class="track-meta">
                ${durationFormatted ? `<span class="duration-badge">⏱️ ${escapeHtml(durationFormatted)}</span>` : ''}
                ${quality ? `<span class="quality-badge">🎧 ${escapeHtml(quality)}</span>` : ''}
                ${trackId ? `<span style="background:rgba(100,100,150,0.2); padding:4px 10px; border-radius:40px; font-size:0.7rem;">🔗 ${escapeHtml(trackId.substring(0,12))}${trackId.length > 12 ? '…' : ''}</span>` : ''}
            </div>
        `;
        
        // Optional: Show source badge
        const sourceBadge = source ? `<div style="font-size:0.7rem; margin-top:6px; color:#6c7890;">source: ${escapeHtml(source)}</div>` : '';
        
        const htmlContent = `
            <div class="result-card">
                <div class="song-grid">
                    <div class="cover-area">
                        <img src="${escapeHtmlAttr(cover)}" alt="album cover" onerror="this.src='https://placehold.co/400x400/11151f/1DB954?text=🎶'">
                    </div>
                    <div class="song-details">
                        <div class="song-title">${escapeHtml(title)}</div>
                        <div class="artist-name">${escapeHtml(artist)}</div>
                        ${metaBadges}
                        <div class="album-name">📀 Spotify Track</div>
                        ${sourceBadge}
                        ${downloadSection}
                    </div>
                </div>
                <div style="margin-top: 16px; font-size: 0.7rem; text-align: center; opacity:0.5;">
                    🎧 Powered by Spotify API • High Quality Audio
                </div>
            </div>
        `;
        
        resultDiv.innerHTML = htmlContent;
    }
    
    // XSS protection helpers
    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        });
    }
    
    function escapeHtmlAttr(str) {
        if (!str) return '';
        return str.replace(/[&"']/g, function(match) {
            if (match === '&') return '&amp;';
            if (match === '"') return '&quot;';
            if (match === "'") return '&#39;';
            return match;
        });
    }
    
    // Enter key support
    urlInput.addEventListener('keypress', function(event) {
        if (event.key === 'Enter') {
            event.preventDefault();
            if (!fetchButton.disabled) {
                downloadSong();
            }
        }
    });
    
    // initial placeholder
    window.addEventListener('DOMContentLoaded', () => {
        document.getElementById('result').innerHTML = `
            <div class="result-card placeholder-text">
                ✨ Paste your favorite Spotify track URL<br>
                and click “Get Song” to preview & grab download link.
            </div>
        `;
    });
</script>
</body>
</html>
